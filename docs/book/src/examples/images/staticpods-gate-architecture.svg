<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" aria-label="The taint holds the node until its mirror pods are in the API server" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" role="img" viewBox="0 0 760 500"><defs><marker id="arch-arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6b7280" d="M0 0L10 5L0 10z"/></marker></defs><rect width="760" height="500" fill="#fff"/><text x="24" y="30" fill="#111827" font-size="15" font-weight="600" text-anchor="start">The taint holds the node until its mirror pods are in the API server</text><rect width="712" height="136" x="24" y="52" fill="none" stroke="#6b7280" stroke-dasharray="6 4" stroke-width="1.25" rx="8"/><text x="40" y="76" fill="#111827" font-size="13" font-weight="600" text-anchor="start">New node</text><rect width="288" height="26" x="432" y="60" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" stroke-width="2" rx="8"/><text x="576" y="77" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="middle">taint: readiness.k8s.io/StaticPodsMirrored</text><rect width="320" height="72" x="40" y="100" fill="none" stroke="#6b7280" stroke-width="1.25" rx="8"/><text x="56" y="124" fill="#111827" font-size="13" font-weight="600" text-anchor="start">Kubelet</text><text x="56" y="140" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">runs static pods from its manifests</text><text x="56" y="156" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">registers the Node with the taint</text><rect width="320" height="72" x="400" y="100" fill="none" stroke="#6b7280" stroke-width="1.25" rx="8"/><text x="416" y="124" fill="#111827" font-size="13" font-weight="600" text-anchor="start">Bootstrap check (DaemonSet)</text><text x="416" y="140" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">init: reads every manifest, waits for</text><text x="416" y="156" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">its mirror pod, posts once, then pause</text><rect width="360" height="72" x="200" y="260" fill="none" stroke="#6b7280" stroke-width="1.25" rx="8"/><text x="216" y="284" fill="#111827" font-size="13" font-weight="600" text-anchor="start">API server</text><text x="216" y="300" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">Node: taint + readiness condition</text><text x="216" y="316" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">Mirror pods &lt;name&gt;-&lt;node&gt;</text><rect width="320" height="72" x="40" y="404" fill="none" stroke="#6b7280" stroke-width="1.25" rx="8"/><text x="56" y="428" fill="#111827" font-size="13" font-weight="600" text-anchor="start">Node Readiness Controller</text><text x="56" y="444" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">rule static-pods-mirrored, bootstrap-only</text><text x="56" y="460" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">removes the taint once, then stops</text><rect width="320" height="72" x="400" y="404" fill="none" stroke="#6b7280" stroke-width="1.25" rx="8"/><text x="416" y="428" fill="#111827" font-size="13" font-weight="600" text-anchor="start">Scheduler</text><text x="416" y="444" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">binds workloads only after the taint</text><text x="416" y="460" fill="#111827" font-size="11.5" font-weight="normal" text-anchor="start">is gone, static pods already counted</text><g fill="none" stroke="#6b7280" stroke-width="1.25"><path marker-end="url(#arch-arrow)" d="M360 136H397"/><path marker-end="url(#arch-arrow)" d="M240 172V257"/><path marker-end="url(#arch-arrow)" marker-start="url(#arch-arrow)" d="M520 175V257"/><path marker-end="url(#arch-arrow)" marker-start="url(#arch-arrow)" d="M280 335V401"/><path marker-start="url(#arch-arrow)" d="M480 335V401"/></g><text x="248" y="218" fill="#6b7280" font-size="11.5" font-weight="normal" text-anchor="start">1 register (tainted)</text><text x="248" y="234" fill="#6b7280" font-size="11.5" font-weight="normal" text-anchor="start">2 create mirror pod</text><text x="528" y="218" fill="#6b7280" font-size="11.5" font-weight="normal" text-anchor="start">3 look up mirror pods</text><text x="528" y="234" fill="#6b7280" font-size="11.5" font-weight="normal" text-anchor="start">4 write Node condition</text><text x="288" y="372" fill="#6b7280" font-size="11.5" font-weight="normal" text-anchor="start">5 watch Node, remove taint</text><text x="488" y="372" fill="#6b7280" font-size="11.5" font-weight="normal" text-anchor="start">6 watch, then bind</text></svg>